name: selfcheck

# Validasi lingkungan SEBELUM user menunggu 10 menit lalu gagal.
# Dijalankan otomatis oleh app setelah repo engine dibuat, dan bisa
# dijalankan manual kapan saja dari tab Actions.

on:
  workflow_dispatch:
    inputs:
      voice:
        description: 'Voice Piper yang diuji'
        required: false
        type: string
        default: 'en_US-lessac-medium'
  push:
    branches: [main]
    paths:
      - 'requirements.txt'
      - 'engine/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: selfcheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selfcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-py311-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-py311-${{ runner.os }}-

      - name: Cache Piper voice
        uses: actions/cache@v4
        with:
          path: .voices
          key: piper-voice-${{ inputs.voice || 'en_US-lessac-medium' }}
          restore-keys: piper-voice-

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || {
            echo "::warning::pip install penuh gagal; selfcheck akan menguji jalur binary"
            grep -v -i '^piper' requirements.txt > requirements.nopiper.txt
            pip install -r requirements.nopiper.txt
          }

      # Image ubuntu-24.04 TIDAK membawa ffmpeg/ffprobe — pasang bila hilang
      # supaya selfcheck benar-benar menangkap environment yang pincang.
      - name: Ensure ffmpeg
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            echo "ffmpeg bawaan image: $(ffmpeg -version | head -1)"
            exit 0
          fi
          echo "ffmpeg tidak ada di image — lapis 1: apt (dengan timeout)"
          if sudo timeout 240 apt-get update -qq && \
             sudo timeout 420 apt-get install -y -qq ffmpeg && \
             command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg via apt: $(ffmpeg -version | head -1)"
            exit 0
          fi
          echo "apt gagal/timeout — lapis 2: static build BtbN"
          curl -fsSL --retry 2 --max-time 300 -o /tmp/ff.tar.xz \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xf /tmp/ff.tar.xz -C /tmp
          sudo install -m755 /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /usr/local/bin/ffmpeg
          sudo install -m755 /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/ffprobe
          echo "ffmpeg static: $(ffmpeg -version | head -1)"

      - name: Environment
        run: |
          echo "runner: $RUNNER_OS / $ImageOS ($ImageVersion)"
          python --version
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -1
          nproc; free -h | head -2

      - name: Mask secrets
        env:
          S1: ${{ secrets.GROQ_API_KEY }}
          S2: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          for v in "$S1" "$S2"; do [ -n "$v" ] && echo "::add-mask::$v"; done
          if [ -z "$S1" ]; then echo "::warning::Secret GROQ_API_KEY belum disetel"; fi

      - name: Piper self-check
        env:
          PIPERS_VOICE_DIR: ${{ github.workspace }}/.voices
        run: |
          python -m engine.main --selfcheck \
            --selfcheck-voice "${{ inputs.voice || 'en_US-lessac-medium' }}" \
            --workspace "${{ runner.temp }}/sc" \
            --out "${{ runner.temp }}/sc-out" \
            --report "${{ runner.temp }}/sc-report.json" \
            | tee selfcheck.json

      - name: Groq key smoke test
        # CATATAN: context `secrets` TIDAK tersedia di ekspresi `if` (job maupun
        # step) — workflow gagal parse saat dispatch. Guard dipindah ke dalam
        # run lewat env (env BOLEH memakai secrets).
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::warning::GROQ_API_KEY belum disetel — smoke test dilewati"
            exit 0
          fi
          python - <<'PY'
          import os, sys, requests
          r = requests.get(
              "https://api.groq.com/openai/v1/models",
              headers={"authorization": f"Bearer {os.environ['GROQ_API_KEY']}"},
              timeout=30,
          )
          print("groq /models ->", r.status_code)
          sys.exit(0 if r.status_code == 200 else 1)
          PY

      - name: Upload selfcheck result
        if: ${{ always() }}
        # artifact = sekadar laporan; kuota storage akun yang penuh TIDAK BOLEH
        # membuat selfcheck yang sehat terlihat gagal (Piper + Groq sudah hijau).
        # Insiden 2026-10-22: "Artifact storage quota has been hit" memerahkan
        # run f398abb & 68db303 padahal semua check lolos.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: selfcheck-result
          path: selfcheck.json
          if-no-files-found: ignore
          retention-days: 3
